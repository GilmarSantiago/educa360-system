<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Contraseña | Educa360</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/variables.css">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-dark) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 30px;
            padding: 40px;
            max-width: 450px;
            width: 100%;
        }
        .form-control {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            border-radius: 12px;
            padding: 12px;
        }
        .form-control:focus {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border-color: var(--primary-accent);
        }
        .btn-recover {
            background: var(--primary-accent);
            border: none;
            border-radius: 12px;
            padding: 14px;
            font-weight: 600;
            width: 100%;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="glass-card animate__animated animate__fadeIn">
        <h2 class="text-center fw-bold mb-3">Recuperar Acceso</h2>
        <p class="text-center opacity-75 mb-4">Ingresa tu correo electrónico y te enviaremos un código para restablecer tu contraseña.</p>
        
        <form id="recoverForm">
            <div class="mb-3">
                <label class="form-label">Correo Electrónico</label>
                <input type="email" class="form-control" id="email" placeholder="ejemplo@correo.com" required>
            </div>
            
            <button type="submit" class="btn btn-recover">Enviar Código</button>
            
            <div class="text-center mt-4">
                <a href="/" class="text-white text-decoration-none opacity-50 small">Volver al inicio de sesión</a>
            </div>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
        document.getElementById('recoverForm').addEventListener('submit', (e) => {
            e.preventDefault();
            Swal.fire({
                icon: 'success',
                title: 'Código Enviado',
                text: 'Revisa tu bandeja de entrada para continuar.',
                confirmButtonColor: '#3b82f6'
            }).then(() => {
                window.location.href = '/';
            });
        });
    </script>
</body>
</html>
