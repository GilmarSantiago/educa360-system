<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso | Educa360</title>
    <!-- Auth Check Inline to prevent UI flash -->
    <script>
        if (localStorage.getItem('token')) {
            const userModules = JSON.parse(localStorage.getItem('userModules') || '[]');
            const firstModule = userModules.length > 0 ? userModules[0].id : 'dashboard';
            window.location.replace('/' + firstModule);
        }
    </script>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Animate.css -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <!-- Custom CSS Variables -->
    <link rel="stylesheet" href="css/variables.css">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background: url('images/login-bg.png') center/cover no-repeat fixed;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            overflow: hidden;
            position: relative;
        }
        /* Overlay to ensure readability */
        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.6) 0%, rgba(47, 191, 113, 0.4) 100%);
            z-index: 1;
        }
        .login-wrapper {
            position: relative;
            z-index: 10;
            width: 100%;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        @media (min-width: 992px) {
            .login-wrapper {
                justify-content: flex-end;
                padding-right: 8%; /* Espacio a la derecha en pantallas grandes */
            }
        }
        .login-container {
            width: 100%;
            max-width: 420px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 40px;
            padding: 50px 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: fadeInScale 0.8s ease-out;
        }
        @media (max-width: 576px) {
            .login-container {
                padding: 40px 25px; /* Menos padding en móviles para que no se vea apretado */
                border-radius: 30px;
            }
        }
        @keyframes fadeInScale {
            0% { opacity: 0; transform: scale(0.9); }
            100% { opacity: 1; transform: scale(1); }
        }
        .brand-section {
            text-align: center;
            margin-bottom: 35px;
        }
        .brand-section h2 {
            font-weight: 700;
            color: var(--primary-accent);
            margin-bottom: 5px;
            letter-spacing: -0.5px;
            font-size: 1.5rem;
        }
        .brand-section p {
            color: #64748b;
            font-size: 0.9rem;
            font-weight: 500;
        }
        .form-label {
            font-weight: 700;
            font-size: 0.7rem;
            margin-bottom: 8px;
            color: var(--primary-accent);
            text-transform: uppercase;
            letter-spacing: 1.2px;
            padding-left: 5px;
        }
        .input-elegant {
            background: #f8fafc;
            border: 2px solid transparent;
            border-radius: 20px;
            padding: 14px 20px;
            color: var(--text-main);
            transition: all 0.3s ease;
            font-weight: 500;
        }
        .input-elegant:focus {
            background: #ffffff;
            border-color: var(--primary-color);
            outline: none;
            box-shadow: 0 0 0 4px rgba(47, 191, 113, 0.1);
        }
        .btn-primary-elegant {
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 20px;
            padding: 16px;
            font-weight: 700;
            width: 100%;
            margin-top: 20px;
            transition: all 0.3s ease;
            font-size: 1rem;
            letter-spacing: 0.5px;
        }
        .btn-primary-elegant:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -5px rgba(47, 191, 113, 0.4);
        }
        .footer-note {
            text-align: center;
            margin-top: 30px;
            font-size: 0.75rem;
            color: #94a3b8;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="login-wrapper">
        <div class="login-container">
            <div class="brand-section">
                <img src="images/logo.png" alt="Educa360 Logo" style="max-height: 90px; margin-bottom: 15px;" onerror="this.outerHTML='<h1 style=\'font-weight:700; margin-bottom: 15px; font-size: 3rem; letter-spacing: -1px;\'><span style=\'color: var(--primary-color);\'>Educa</span><span style=\'color: var(--primary-accent);\'>360</span></h1>'">
                <h2>INICIAR SESIÓN</h2>
                <p>Ingresa tus credenciales para acceder</p>
            </div>

            <form id="loginForm">
                <div class="mb-4">
                    <label class="form-label">Usuario o Correo</label>
                    <input type="text" class="form-control input-elegant" id="username" placeholder="Tu usuario" required>
                </div>
                
                <div class="mb-4">
                    <label class="form-label">Contraseña</label>
                    <input type="password" class="form-control input-elegant" id="password" placeholder="••••••••" required minlength="3">
                </div>

                <button type="submit" class="btn btn-primary-elegant">
                    ACCEDER AL SISTEMA
                </button>
            </form>

            <div class="footer-note">
                &copy; 2026 Educa360 System &bull; Todos los derechos reservados
            </div>
        </div>
    </div>

    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="js/auth_v3.js"></script>
</body>
</html>
