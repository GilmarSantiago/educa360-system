<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Educa360</title>
    <!-- Auth Check Inline to prevent UI flash -->
    <script>
        if (!localStorage.getItem('token') || !localStorage.getItem('role')) {
            window.location.replace('/');
        }
    </script>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/dashboard_v3.css">

</head>
<body>

    <div class="layout-wrapper">
        <!-- Sidebar -->
        <aside id="sidebar" class="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <img src="images/logo.png" alt="Educa360" class="sidebar-logo" style="max-height: 40px;" onerror="this.outerHTML='<div class=\'logo-icon\'>E</div><div class=\'logo-text\' style=\'font-weight:700; font-size:1.5rem; letter-spacing:-1px;\'><span style=\'color: var(--primary-color);\'>Educa</span><span style=\'color: var(--primary-accent);\'>360</span></div>'">
                </div>
            </div>

            <nav class="sidebar-nav">
                <ul id="sidebarMenu">
                    <!-- Dynamic modules here -->
                </ul>
            </nav>

            <div class="sidebar-footer">
                <button class="btn-logout" onclick="logout()">
                    <i class="fas fa-sign-out-alt"></i>
                    <span>Cerrar Sesión</span>
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="top-navbar">
                <div class="navbar-left">
                    <button id="toggleSidebar" class="toggle-btn">
                        <i class="fas fa-arrow-left"></i>
                    </button>
                    <h4 id="pageTitle" class="mb-0 ms-4 fw-bold d-none d-lg-block">Dashboard</h4>
                </div>
                
                <div class="navbar-right">
                    <!-- Date removed for space -->
                    
                    <!-- Profile Dropdown -->
                    <div class="dropdown">
                        <div class="user-profile-nav dropdown-toggle" id="profileDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                            <div class="user-info-text d-none d-md-block text-end me-3">
                                <h6 class="mb-0 fw-bold displayUserNameText">Usuario</h6>
                                <small class="text-muted displayUserRoleText">Rol</small>
                            </div>
                            <img src="https://ui-avatars.com/api/?name=User" class="nav-avatar userAvatarImg" alt="User">
                        </div>
                        <ul class="dropdown-menu dropdown-menu-end shadow border-0 p-2 animate__animated animate__fadeIn" aria-labelledby="profileDropdown" style="min-width: 240px; border-radius: 15px;">
                            <li><h6 class="dropdown-header">Mi Cuenta</h6></li>
                            <li><a class="dropdown-item rounded-3" href="javascript:void(0)" onclick="openProfileModal(event)"><i class="fas fa-user-circle me-2 opacity-50"></i> Ver Perfil</a></li>
                            
                            <!-- Admin Only Options -->
                            <li class="adminOnlyOption" style="display:none;">
                                <hr class="dropdown-divider">
                                <h6 class="dropdown-header">Gestión Colegio</h6>
                                <a class="dropdown-item rounded-3" href="javascript:void(0)" onclick="loadModule('school', null, event)"><i class="fas fa-school me-2 opacity-50"></i> Configurar Colegio</a>
                                <a class="dropdown-item rounded-3" href="javascript:void(0)" onclick="loadModule('schedules', null, event)"><i class="fas fa-clock me-2 opacity-50"></i> Horarios y Secciones</a>
                            </li>

                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item rounded-3 text-danger" href="javascript:void(0)" onclick="logout(event)"><i class="fas fa-sign-out-alt me-2"></i> Cerrar Sesión</a></li>
                        </ul>
                    </div>
                </div>
            </header>

            <div class="content-body animate__animated animate__fadeIn">
                <div class="container-fluid px-0">
                    <div class="welcome-banner">
                        <div class="banner-text">
                            <h2 id="welcomeText" class="mb-2">Bienvenido/a, Usuario !</h2>
                            <p id="welcomeSubtitle">Director, vamos a gestionar tu Campus educativo a todo nivel !</p>
                        </div>
                    </div>

                    <div class="row g-4 m-0" id="dashboardWidgets" style="width: 100%;">
                        <!-- Dynamic widgets here -->
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Profile Modal -->
    <div class="modal fade" id="profileModal" tabindex="-1" aria-labelledby="profileModalLabel" aria-hidden="true" data-bs-backdrop="static">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content global-modal-content">
                <div class="modal-header global-modal-header">
                    <h5 class="modal-title fw-bold" id="profileModalLabel"><i class="fas fa-user-circle me-2"></i> Mi Perfil</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body p-4">
                    <form id="profileForm">
                        <!-- Profile Image Section -->
                        <div class="text-center mb-4">
                            <div class="position-relative d-inline-block">
                                <img src="https://ui-avatars.com/api/?name=User" id="prof_avatar_preview" class="rounded-circle border border-3 border-light shadow-sm" style="width: 100px; height: 100px; object-fit: cover;" alt="Avatar">
                                <label for="prof_avatar" class="position-absolute bottom-0 end-0 bg-primary text-white rounded-circle p-2 shadow-sm" style="cursor: pointer; background-color: var(--primary-color) !important; border: 2px solid white; transform: translate(25%, 25%);">
                                    <i class="fas fa-camera"></i>
                                </label>
                                <input type="file" id="prof_avatar" accept="image/*" class="d-none" onchange="previewAvatar(event)">
                            </div>
                        </div>

                        <div class="row g-3">
                            <!-- Required Fields -->
                            <div class="col-md-12">
                                <label class="form-label text-muted small fw-bold mb-1">NOMBRE COMPLETO *</label>
                                <input type="text" class="form-control rounded-pill bg-light border-0 px-3" id="prof_name" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label text-muted small fw-bold mb-1">CORREO ELECTRÓNICO *</label>
                                <input type="email" class="form-control rounded-pill bg-light border-0 px-3" id="prof_email" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label text-muted small fw-bold mb-1">ROL</label>
                                <input type="text" class="form-control rounded-pill bg-light border-0 px-3" id="prof_role" readonly disabled>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label text-muted small fw-bold mb-1">USUARIO *</label>
                                <input type="text" class="form-control rounded-pill bg-light border-0 px-3" id="prof_username" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label text-muted small fw-bold mb-1">CONTRASEÑA</label>
                                <div class="input-group">
                                    <input type="password" class="form-control rounded-start-pill bg-light border-0 px-3" id="prof_password" placeholder="Dejar en blanco para no cambiar">
                                    <button class="btn btn-light rounded-end-pill bg-light border-0" type="button" onclick="togglePassword()"><i class="fas fa-eye"></i></button>
                                </div>
                            </div>

                            <hr class="my-4 opacity-10">
                            
                            <!-- Optional Fields -->
                            <div class="col-md-6">
                                <label class="form-label text-muted small fw-bold mb-1">TELÉFONO</label>
                                <input type="text" class="form-control rounded-pill bg-light border-0 px-3" id="prof_phone">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label text-muted small fw-bold mb-1">FECHA NACIMIENTO</label>
                                <input type="date" class="form-control rounded-pill bg-light border-0 px-3" id="prof_birthdate">
                            </div>
                            <div class="col-md-12">
                                <label class="form-label text-muted small fw-bold mb-1">DIRECCIÓN</label>
                                <input type="text" class="form-control rounded-pill bg-light border-0 px-3" id="prof_address">
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer border-0 p-4 pt-0">
                    <button type="button" class="btn btn-light rounded-pill px-4" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary rounded-pill px-4" style="background-color: var(--primary-color); border: none;" onclick="saveProfile()">Guardar Cambios</button>
                </div>
            </div>
        </div>
    </div>


    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="js/modal-manager.js"></script>
    <script src="js/institution.js"></script>
    <script src="js/settings.js"></script>
    <script src="js/enrollments.js"></script>
    <script src="js/payments-ui.js"></script>
    <script src="js/caja.js"></script>
    <script src="js/reporte-cajas.js"></script>
    <script src="js/academic_records.js"></script>
    <script src="js/dashboard_v3.js"></script>
</body>
</html>
